name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: python tools/check_public_tree.py
      - run: python tools/sync_locales.py --check
      - name: Verify exact runtime release candidate
        run: python tools/build_release.py --version 0.1.0-alpha.2
      - run: python -m compileall -q custom_components

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Real Home Assistant isolated smoke test
        run: >-
          docker run --rm --network none --cap-drop ALL
          --security-opt no-new-privileges --memory 1g
          --mount type=bind,src=${{ github.workspace }},dst=/work,readonly
          --entrypoint python ghcr.io/home-assistant/home-assistant:2026.8.2
          /work/tests/ha_smoke.py

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb

  application-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: candidate
          persist-credentials: false
      - name: Exact reviewed development baseline (not a shipped release)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 0d2a490f6c90ce780cceab3a9e1160b97fbd25e9
          path: baseline
          persist-credentials: false
      - name: Retain synthetic Config Entry, Options and domain data across versions
        run: >-
          docker run --rm --network none --cap-drop ALL
          --security-opt no-new-privileges --memory 1g
          --mount type=bind,src=${{ github.workspace }},dst=/work,readonly
          --entrypoint python ghcr.io/home-assistant/home-assistant:2026.8.2
          /work/candidate/tools/run_upgrade_acceptance.py
          --baseline /work/baseline --candidate /work/candidate --timeout-seconds 300

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
