name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: python tools/check_public_tree.py
      - run: python tools/sync_locales.py --check
      - name: Verify exact runtime release candidate
        run: python tools/build_release.py --version 0.1.0-alpha.18
      - run: python -m compileall -q custom_components

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Stage pinned public PDF decoder (hash checked inside isolated runner)
        run: >-
          python -m pip download --no-deps --only-binary=:all: --dest dependencies pypdf==6.17.0
      - name: Real Home Assistant isolated smoke test
        run: >-
          docker run --rm --network none --cap-drop ALL
          --security-opt no-new-privileges --memory 1g
          --mount type=bind,src=${{ github.workspace }},dst=/work,readonly
          --entrypoint python ghcr.io/home-assistant/home-assistant:2026.8.2
          /work/tests/ha_dependency_smoke.py
          --wheel /work/dependencies/pypdf-6.17.0-py3-none-any.whl --case smoke

  encrypted-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: candidate
          persist-credentials: false
      - name: Stage pinned public PDF decoder (hash checked inside isolated runner)
        run: >-
          python -m pip download --no-deps --only-binary=:all: --dest dependencies pypdf==6.17.0
      - name: Native encrypted Core restore and fresh authenticated bootstrap
        run: >-
          docker run --rm --network none --cap-drop ALL
          --security-opt no-new-privileges --memory 1g
          --mount type=bind,src=${{ github.workspace }},dst=/work,readonly
          --entrypoint python ghcr.io/home-assistant/home-assistant:2026.8.2
          /work/candidate/tests/ha_dependency_smoke.py
          --wheel /work/dependencies/pypdf-6.17.0-py3-none-any.whl --case restore --
          --source /work/candidate --timeout-seconds 300

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb

  application-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: candidate
          persist-credentials: false
      - name: Exact published alpha.3 baseline
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 7930f7e8825de158a2d3facc590f44e40d78a4b5
          path: baseline
          persist-credentials: false
      - name: Stage pinned public PDF decoder (hash checked inside isolated runner)
        run: >-
          python -m pip download --no-deps --only-binary=:all: --dest dependencies pypdf==6.17.0
      - name: Retain synthetic Config Entry, Options and domain data across versions
        run: >-
          docker run --rm --network none --cap-drop ALL
          --security-opt no-new-privileges --memory 1g
          --mount type=bind,src=${{ github.workspace }},dst=/work,readonly
          --entrypoint python ghcr.io/home-assistant/home-assistant:2026.8.2
          /work/candidate/tests/ha_dependency_smoke.py
          --wheel /work/dependencies/pypdf-6.17.0-py3-none-any.whl --case upgrade --
          --baseline /work/baseline --candidate /work/candidate --timeout-seconds 300

  hacs-installer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: candidate
          persist-credentials: false
      - name: Exact published alpha.3 baseline
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 7930f7e8825de158a2d3facc590f44e40d78a4b5
          path: baseline
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Fetch public pinned installer inputs (hashes verified before use)
        run: |
          mkdir dependencies
          curl --fail --location --retry 3 --max-time 120 \
            https://github.com/hacs/integration/releases/download/2.0.5/hacs.zip \
            --output dependencies/hacs.zip
          python -m pip download --no-deps --only-binary=:all: \
            --dest dependencies aiogithubapi==22.10.1
          python -m pip download --no-deps --only-binary=:all: \
            --dest dependencies pypdf==6.17.0
      - name: Real HACS installer, failed-download rollback and application continuity
        run: >-
          docker run --rm --network none --cap-drop ALL
          --security-opt no-new-privileges --memory 1g
          --mount type=bind,src=${{ github.workspace }},dst=/work,readonly
          --entrypoint python ghcr.io/home-assistant/home-assistant:2026.8.2
          /work/candidate/tests/ha_dependency_smoke.py
          --wheel /work/dependencies/pypdf-6.17.0-py3-none-any.whl --case hacs --
          --baseline /work/baseline --candidate /work/candidate
          --hacs-archive /work/dependencies/hacs.zip
          --aiogithubapi-wheel /work/dependencies/aiogithubapi-22.10.1-py3-none-any.whl
          --timeout-seconds 300

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
