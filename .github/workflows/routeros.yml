name: Native RouterOS acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: routeros-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-routeros:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download and verify the official disposable CHR fixture
        run: |
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 15 --max-time 300 --retry 2 --retry-all-errors \
            --retry-delay 3 --retry-max-time 700 --output "$RUNNER_TEMP/chr.img.zip" \
            https://download.mikrotik.com/routeros/7.20.1/chr-7.20.1.img.zip
          echo "aab591e9c2da21d8416ad1ed9966fa2359ebef7a25c3b20453efe93f05234e6b  $RUNNER_TEMP/chr.img.zip" | sha256sum --check
      - name: Build developer-only QEMU image
        run: docker build -t local/family-routeros-test tests/routeros
      - name: Native HTTPS REST, DHCP, traffic and restart tests
        run: >-
          docker run --rm --network none --cap-drop ALL
          --security-opt no-new-privileges --memory 768m --cpus 1
          --env FAMILY_ROUTEROS_ISOLATED=1
          --env FAMILY_ROUTEROS_SHA256=aab591e9c2da21d8416ad1ed9966fa2359ebef7a25c3b20453efe93f05234e6b
          --mount type=bind,src=${{ github.workspace }},dst=/work,readonly
          --mount type=bind,src=${{ runner.temp }}/chr.img.zip,dst=/input/chr.img.zip,readonly
          local/family-routeros-test
