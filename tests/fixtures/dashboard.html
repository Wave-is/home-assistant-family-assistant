<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Assistant synthetic dashboard</title>
<style>
body{margin:0;background:#eef3f1;font-family:system-ui;padding:28px;color:#19332f}main{max-width:620px;margin:auto}
body.dark{background:#142320;--ha-card-background:#20342e;--primary-text-color:#eaf4ec;--secondary-text-color:#a8bdb4;--divider-color:#3b5148}
@media(max-width:420px){body{padding:12px}}
</style>
<main id="cards"></main>
<script type="module">
import "../../custom_components/family_assistant/frontend/family-assistant.js";
const query=new URLSearchParams(location.search),view=query.get("view") || "shopping",language=query.get("lang") || "en";
document.documentElement.lang=language;if(query.has("dark"))document.body.classList.add("dark");
const data={revision:1,settings:{name:{ru:"Наша семья",uk:"Наша родина",en:"Our family"}[language],modules:["shopping","tasks","court","alarms"]},actor:query.get("role")==="child"?"child":"owner",role:query.get("role") || "owner",
members:[{id:"owner",name:{en:"Parent 1",ru:"Родитель 1",uk:"Батько 1"}[language],active:true},{id:"child",name:{en:"Child 1",ru:"Ребёнок 1",uk:"Дитина 1"}[language],active:true}],
shopping:[{id:"S000001",name:{en:"Apples",ru:"Яблоки",uk:"Яблука"}[language],quantity:3,purchased:1,unit:"kg",status:"approved",revision:1},{id:"S000002",name:{en:"Watercolour set",ru:"Набор акварели",uk:"Набір акварелі"}[language],quantity:1,purchased:0,unit:"",status:"pending",revision:1}],
tasks:[{id:"T000001",title:{en:"Water the plants",ru:"Полить растения",uk:"Полити рослини"}[language],assignee:"child",status:"assigned",due_at:"2026-09-10T17:00:00Z",revision:1}],
court:[{id:"C000001",member:"child",reason:{en:"Helped with dinner",ru:"Помог с ужином",uk:"Допоміг з вечерею"}[language],points:2,status:"active",revision:1}]};
data.alarms=[{id:"A000001",member:"child",name:"",time:"07:30",timezone:"Europe/Berlin",days:[0,1,2,3,4],profile:"strict",enabled:true,revision:1}];
data.shopping_series=[];
data.members[0].role="owner";data.members[1].role="child";
data.members.forEach(member=>member.revision=1);
data.settings.timezone="Europe/Berlin";
if(query.has("taskedit")) {
 data.settings.timezone="Europe/Berlin";
 Object.assign(data.tasks[0],{creator:"owner",report_type:"text",report:null,checklist:[{text:{ru:"Проверить почву",uk:"Перевірити ґрунт",en:"Check soil"}[language],done:false}],deadline_policy:{reminder_minutes:60,grace_minutes:30,penalty:0}});
}
if(query.has("shoppingmerge")){
 data.shopping.push({...data.shopping[0],id:"S000003",quantity:2,purchased:0,revision:3});
 for(const item of data.shopping)item.history=[{at:"2026-09-06T08:00:00Z",actor:"owner",action:"add",detail:{quantity:item.quantity,unit:item.unit}}];
}
if(query.has("shoppingseries"))data.shopping_series=[{id:"B000001",revision:3,name:"Молоко",quantity:2,unit:"л",buyer:"child",note:"",category:"",store:"",enabled:true,rule:{frequency:"weekly",interval:1,start_date:"2026-09-01",time:"08:00",timezone:"Europe/Kyiv",weekdays:[0,4],month_day:1,until:null,exceptions:["2026-12-25"],catchup_hours:24}}];
data.alarm_runs=query.has("ringing")?[{id:"W000001",member:"child",stage:"first",siren_desired:true,test:true,challenge:{nonce:"synthetic-nonce",question:"3 + 4",choices:[5,7,9,6]}}]:[];
data.health={telegram:"connected"};data.delivery_issues=[{id:"synthetic-delivery",recipient:"child",key:"task_assigned",state:"uncertain",created_at:"2026-09-06T08:00:00Z",attempts:1}];
if(query.has("proposal")){data.settings.modules.push("conversation");data.proposals=[{id:"Psynthetic",status:"pending",preview:"Полить цветы · Ребёнок 1 · завтра 20:00",expires_at:"2099-09-06T08:00:00Z"}];}
if(view==="conversation"){data.settings.modules.push("conversation");data.learned_phrases=[];data.conversation_source={enabled:true,configured:false,allowed:true,revision:"c".repeat(32)};}
if(view==="mikrotik"){data.settings.modules.push("mikrotik");data.network={inventory:{observed_at:"2026-09-06T08:00:00Z",fasttrack:true,ipv6:"disabled",capabilities:{wifi:"network_missing"},devices:[{mac:"02:11:22:33:44:55",addresses:["198.51.100.10"],comments:["Existing comment"],hostnames:["mobile"],sources:["leases","arp"],warnings:["locally_administered"],suggested_name:"Example phone",suggestions:[{name:"Example phone",evidence:["exact_mac"],confidence:100,area:"Bedroom"}]}]}};}
if(view==="calendar"){
  data.settings.modules.push("calendar");data.settings.timezone="Europe/Kyiv";
  data.members.forEach(m=>m.role=m.id==="owner"?"owner":"child");
  const record={id:"E000001",title:{en:"School outing",ru:"Школьная поездка",uk:"Шкільна поїздка"}[language],description:"",location:"",start:"2026-10-25T03:30:15+02:00",end:"2026-10-25T04:30:45+02:00",all_day:false,timezone:"Europe/Kyiv",participants:["child"],escort:null,preparation:["Synthetic notebook"],reminder_minutes:[15],visibility:"family",status:"tentative",creator:"child",revision:1,archived:false,history:[]};
  data.calendar={config:{publish_to_ha:false,revision:0},events:[record],occurrences:[{...record,event_id:record.id}]};
  window.calendarFixture=data;window.calendarOperations=new Map();
}
window.calls=[];const card=document.createElement("family-assistant-card");card.setConfig({view,entry_id:"synthetic"});
if(view==="mikrotik"){data.network.writable=query.has("write");data.network.plans=[];data.network.inventory.devices[0].leases=[{".id":"*1",address:"198.51.100.10",server:"lan",dynamic:"true",status:"bound",comment:"Existing comment"}];}
if(query.has("kids")){data.settings.timezone="UTC";data.members[0].role="owner";data.members[1].role="child";data.kid_control={can_manage:data.role!=="child",writable:true,observed_at:"2026-09-06T08:00:00Z",plans:[],profiles:[{member:"child",name:"Child profile",device_names:["Phone"],observed:{disabled:"false",paused:"false",...Object.fromEntries(["mon","tue","wed","thu","fri","sat","sun"].map(d=>[d,"08:00-22:00"]))}}]};}
if(query.has("kidstatus")){
 const profile=data.kid_control.profiles[0];
 data.settings.timezone="Europe/Kyiv";
 profile.status={mode:"unrestricted",allows:true,next_change_at:"2026-09-07T20:00:00Z",next_allows:false,remaining_minutes:30,temporary_until:"2026-09-07T20:00:00Z",temporary_mode:"grant",valid_until:new Date(Date.now()+120000).toISOString(),reason:"fresh"};
 if(query.get("kidstatus")==="stale"){profile.status.valid_until="2000-01-01T00:00:00Z";profile.observed.disabled="true";}
}
if(query.has("courtedit")){
  data.settings.timezone="Europe/Kyiv";
  window.courtFixture=data;
  data.members=[
    {id:"owner",name:{en:"Parent 1",ru:"Родитель 1",uk:"Батько 1"}[language],active:true,role:"owner"},
    {id:"parent2",name:{en:"Parent 2",ru:"Родитель 2",uk:"Батько 2"}[language],active:true,role:"parent"},
    {id:"child",name:{en:"Child 1",ru:"Ребёнок 1",uk:"Дитина 1"}[language],active:true,role:"child"}
  ];
  data.court_config={revision:1,weekly_enabled:false,weekday:0,time:"00:00",second_adult_review:false};
  data.court=[
    {id:"C000001",member:"child",actor:"owner",reason:{en:"Helped with dinner",ru:"Помог с ужином",uk:"Допоміг з вечерею"}[language],points:2,status:"active",revision:1,source:"manual",created_at:"2026-09-06T08:00:00Z"}
  ];
  data.court_summary={start:"2026-08-31T00:00:00Z",end:"2026-09-07T00:00:00Z",timezone:"Europe/Kyiv",rows:[{member:"child",active_positives:2,active_negatives:0,total:2,reversed_count:0}]};
}
if(query.has("rewards")&&view==="court"){
  data.settings.timezone="Europe/Kyiv";
  Object.assign(data.court[0],{points:15,actor:"owner",source:"manual",created_at:"2026-09-06T08:00:00Z"});
  data.rewards={
    catalog:[{id:"R000001",name:"Cinema trip",cost:10,description:"Weekend movie",enabled:true,request_ttl_hours:72,eligible:[],revision:1}],
    requests:[],
    balances:[{member:"child",earned:15,reserved:0,spent:0,net:15,available:15},{member:"owner",earned:0,reserved:0,spent:0,net:0,available:0}]
  };
  window.rewardFixture=data;
  window.rewardOperations=new Map();
}
card.hass={language,user:{id:"synthetic-ha-user"},callWS:async message=>{
  if(message.type.endsWith("/network_refresh")){window.calls.push(message);return structuredClone(data.network);}
  if(message.type.endsWith("/chat")){window.calls.push(message);return {reply:"Я тут. Списки и задачи работают без модели."};}
  if(message.type.endsWith("/execute")){
    window.calls.push(message);if(window.failCommand)throw {code:"storage_error"};
    if(message.action.startsWith("calendar.")){
      if(window.calendarOperations.has(message.operation_id))return structuredClone(window.calendarOperations.get(message.operation_id));
      const p=message.payload,action=message.action.slice(9);let result;
      if(action==="configure"){
        if(data.role!=="owner")throw {code:"forbidden"};
        if(p.revision!==data.calendar.config.revision)throw {code:"conflict"};
        if(p.publish_to_ha&&!data.calendar.config.publish_to_ha&&!p.confirm_public_visibility)throw {code:"confirmation_required"};
        result=data.calendar.config={publish_to_ha:p.publish_to_ha,revision:p.revision+1};
      }else{
        let record=data.calendar.events.find(e=>e.id===p.id);
        if(p.id&&(!record||record.revision!==p.revision))throw {code:"conflict"};
        if(action==="save"){
          if(!record){record={id:`E${String(data.calendar.events.length+1).padStart(6,"0")}`,creator:data.actor,revision:0,history:[],archived:false};data.calendar.events.push(record);}
          Object.assign(record,p,{status:data.role==="child"?"tentative":"confirmed"});
        }else if(action==="approve"){
          if(!["parent","owner"].includes(data.role))throw {code:"forbidden"};record.status="confirmed";
        }else if(action==="cancel")record.status="cancelled";
        else if(action==="archive")record.archived=true;
        record.revision++;record.history.push({action:action==="save"?"updated":action,actor:data.actor,at:new Date().toISOString(),reason:p.reason||""});result=record;
        data.calendar.occurrences=data.calendar.events.filter(e=>!e.archived&&e.status!=="cancelled").map(e=>({...e,event_id:e.id}));
      }
      window.calendarOperations.set(message.operation_id,structuredClone(result));return structuredClone(result);
    }
    if(message.action.startsWith("court.reward_")&&window.rewardOperations.has(message.operation_id))return structuredClone(window.rewardOperations.get(message.operation_id));
    const rewardDone=result=>{window.rewardOperations.set(message.operation_id,structuredClone(result));return structuredClone(result);};
    if(message.action==="court.configure"){
      if(data.court_config && message.payload.revision!==data.court_config.revision)throw {code:"conflict"};
      data.court_config={...data.court_config,...message.payload,revision:(data.court_config?.revision ?? 0)+1};
      return structuredClone(data.court_config);
    }
    if(message.action==="court.award"){
      const rec={id:`C${String(data.court.length+1).padStart(6,"0")}`,member:message.payload.member,points:message.payload.points,reason:message.payload.reason,actor:data.actor,created_at:new Date().toISOString(),status:"active",source:"manual",revision:1};
      data.court.push(rec);
      return rec;
    }
    if(message.action==="court.appeal"){
      const rec=data.court.find(c=>c.id===message.payload.id);
      if(rec.revision!==message.payload.revision)throw {code:"conflict"};
      rec.appeal={reason:message.payload.reason,actor:data.actor,at:new Date().toISOString(),status:"pending"};
      rec.revision++;
      return structuredClone(rec);
    }
    if(message.action==="court.resolve_appeal"){
      const rec=data.court.find(c=>c.id===message.payload.id);
      if(rec.revision!==message.payload.revision)throw {code:"conflict"};
      const resolution={reason:message.payload.reason,actor:data.actor,at:new Date().toISOString()};
      if(message.payload.decision==="reverse"){
        rec.status="reversed";
        rec.reversal=resolution;
      }
      if(rec.appeal)rec.appeal={...rec.appeal,status:"resolved",decision:message.payload.decision,resolution};
      rec.revision++;
      return structuredClone(rec);
    }
    if(message.action==="court.reverse"){
      const rec=data.court.find(c=>c.id===message.payload.id);
      if(rec.revision!==message.payload.revision)throw {code:"conflict"};
      rec.status="reversed";
      rec.reversal={reason:message.payload.reason,actor:data.actor,at:new Date().toISOString()};
      rec.revision++;
      return structuredClone(rec);
    }
    if(message.action==="court.reward_save"){
      const cat=data.rewards.catalog,p=message.payload;
      if(p.id){
        const it=cat.find(c=>c.id===p.id);if(!it||it.revision!==p.revision)throw {code:"conflict"};
        Object.assign(it,p,{revision:it.revision+1});return rewardDone(it);
      }
      const item={...p,id:`R${String(cat.length+1).padStart(6,"0")}`,revision:1};
      cat.push(item);return rewardDone(item);
    }
    if(message.action==="court.reward_request"){
      const rItem=data.rewards.catalog.find(c=>c.id===message.payload.id);
      if(!rItem||rItem.revision!==message.payload.revision)throw {code:"conflict"};
      const prev=data.rewards.requests.find(r=>r.opId===message.operation_id);if(prev)return structuredClone(prev);
      const req={id:`V${String(data.rewards.requests.length+1).padStart(6,"0")}`,name:rItem.name,cost:rItem.cost,description:rItem.description,member:message.payload.member,status:"requested",created_at:new Date().toISOString(),revision:1,history:[{actor:data.actor,at:new Date().toISOString(),status:"requested",reason:message.payload.note||""}],opId:message.operation_id};
      data.rewards.requests.push(req);
      const b=data.rewards.balances.find(x=>x.member===req.member);
      if(b){b.reserved+=req.cost;b.net=b.earned-b.reserved-b.spent;b.available=Math.max(0,b.net);}
      return rewardDone(req);
    }
    if(message.action==="court.reward_transition"){
      const req=data.rewards.requests.find(r=>r.id===message.payload.id);
      if(!req||req.revision!==message.payload.revision)throw {code:"conflict"};
      if(req.transOpId===message.operation_id)return structuredClone(req);
      const dec=message.payload.decision,stMap={approve:"approved",fulfill:"fulfilled",cancel:"cancelled",reject:"rejected",refund:"refunded"};
      req.status=stMap[dec]||dec;req.history.push({actor:data.actor,at:new Date().toISOString(),status:req.status,reason:message.payload.reason});
      req.revision++;req.transOpId=message.operation_id;
      const b=data.rewards.balances.find(x=>x.member===req.member);
      if(b){
        if(dec==="fulfill"){b.reserved-=req.cost;b.spent+=req.cost;}
        else if(["cancel","reject"].includes(dec)){b.reserved-=req.cost;}
        else if(dec==="refund"){b.spent-=req.cost;}
        b.net=b.earned-b.reserved-b.spent;b.available=Math.max(0,b.net);
      }
      return rewardDone(req);
    }
   if(message.action==="shopping.add")data.shopping.push({id:"S000003",...message.payload,purchased:0,status:"approved",revision:1});
   if(message.action==="tasks.create")data.tasks.push({id:"T000002",...message.payload,creator:data.actor,status:"assigned",revision:1,checklist:message.payload.checklist.map(text=>({text,done:false}))});
   if(message.action.startsWith("tasks.") && message.action!=="tasks.create" && !message.action.includes("series_")){
     const item=data.tasks.find(t=>t.id===message.payload.id),p=message.payload;
     if(p.revision!==item.revision)throw {code:"revision_conflict"};
     if(message.action==="tasks.check")item.checklist[p.checklist_index].done=p.done;
     if(message.action==="tasks.revise"){
       for(const key of ["title","due_at","assignee"])if(key in p)item[key]=p[key];
       for(const key of ["reminder_minutes","grace_minutes","penalty"])if(key in p)item.deadline_policy[key]=p[key];
     }
     const statuses={"tasks.accept":"accepted","tasks.start":"in_progress","tasks.submit":"submitted","tasks.request_changes":"needs_changes","tasks.complete":"completed","tasks.cancel":"cancelled","tasks.archive":"archived"};
     if(message.action in statuses)item.status=statuses[message.action];
     if("report" in p)item.report=p.report;if("note" in p)item.review_note=p.note;item.revision++;
   }
   if(message.action==="shopping.purchase"){
     const item=data.shopping.find(i=>i.id===message.payload.id),amount=message.payload.quantity ?? item.quantity-item.purchased;
     item.purchased+=amount;item.revision++;
     if(item.purchased>=item.quantity)item.status="purchased";
     (item.history??=[]).push({at:"2026-09-06T09:00:00Z",actor:"owner",action:"purchase",detail:{amount,purchased:item.purchased,remaining:item.quantity-item.purchased}});
   }
   if(message.action==="shopping.merge"){
     const target=data.shopping.find(i=>i.id===message.payload.id);
     for(const ref of message.payload.sources){const source=data.shopping.find(i=>i.id===ref.id);target.quantity+=source.quantity;target.purchased+=source.purchased;source.status="merged";source.merged_into=target.id;source.revision++;(source.history??=[]).push({at:"2026-09-06T09:00:00Z",actor:"owner",action:"merge",detail:{merged_into:target.id}});}
     target.revision++;(target.history??=[]).push({at:"2026-09-06T09:00:00Z",actor:"owner",action:"merge",detail:{sources:message.payload.sources.map(s=>s.id),quantity:target.quantity,purchased:target.purchased}});
   }
   if(message.action==="shopping.series_save"){
     const idx=data.shopping_series.findIndex(s=>s.id===message.payload.id);
     const item={...message.payload,id:message.payload.id || "B000001",revision:idx>=0?data.shopping_series[idx].revision+1:1};
     if(idx>=0)data.shopping_series[idx]=item;else data.shopping_series.push(item);
   }
   if(message.action==="shopping.series_enable")Object.assign(data.shopping_series.find(s=>s.id===message.payload.id),{enabled:message.payload.enabled,revision:message.payload.revision+1});
   if(message.action==="conversation.confirm" || message.action==="conversation.reject")data.proposals=[];
   if(message.action==="conversation.learn")data.learned_phrases.push({id:"Lsynthetic",...message.payload,active:true,revision:1});
   if(message.action==="mikrotik.lease_plan"){const target=message.payload.leases[0];data.network.plans=[{id:"N000001",status:"preview",expires_at:"2099-09-06T08:00:00Z",requires_dhcp_recovery_consent:true,targets:[{id:target.id,mac:"02:11:22:33:44:55",address:"198.51.100.10",server:"lan",old_comment:"Existing comment",comment:target.replace_comment?target.comment:"Existing comment",convert:true,changed:true,warnings:[]}]}];}
   if(message.action==="mikrotik.lease_apply")data.network.plans[0].status="applied";
   if(message.action==="mikrotik.kid_plan")data.kid_control.plans=[{id:"K000001",actor:data.actor,member:"child",mode:message.payload.mode,status:"preview",expires_at:"2099-09-06T08:00:00Z",until:message.payload.minutes?"2099-09-06T08:30:00Z":null,diff:{disabled:{before:"false",after:"true"}}}];
   if(message.action==="mikrotik.kid_apply")data.kid_control.plans[0].status="applied";
   return {id:"S000003"};
 }
 return structuredClone(data);
}};
document.getElementById("cards").append(card);
</script></html>
