<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Synthetic school work dashboard</title>
  <style>
    body { margin: 0; padding: 16px; background: #eef3f1; font-family: system-ui; }
    main { max-width: 680px; margin: auto; }
  </style>
  <main></main>
  <script type="module">
    import "../../custom_components/family_assistant/frontend/family-assistant.js";

    const query = new URLSearchParams(location.search);
    const language = query.get("lang") || "en";
    const actor = query.get("actor") || "parent";
    const subject = language === "en" ? "Mathematics" : "Математика";
    const clone = (value) => structuredClone(value);
    const members = [
      { id: "parent", name: "Alex", role: "parent", active: true, revision: 1 },
      { id: "child", name: "Sam", role: "child", active: true, revision: 3 },
      { id: "sibling", name: "Jamie", role: "child", active: true, revision: 2 },
      { id: "adult", name: "Taylor", role: "adult", active: true, revision: 1 },
    ];
    const makeTask = (id, assignee, assigneeRevision, title) => ({
      id,
      revision: 1,
      title,
      assignee,
      assignee_revision: assigneeRevision,
      creator: "parent",
      due_at: "2026-09-08T15:00:00+00:00",
      created_at: "2026-09-07T07:00:00+00:00",
      status: "assigned",
      report_type: "text",
      report: null,
      deadline_policy: { reminder_minutes: 60, grace_minutes: 30, penalty: 0 },
      checklist: [{ text: "Read the assigned pages", done: false }],
      delivery_scope: "private",
      source: {
        kind: "school_homework",
        member: assignee,
        member_revision: assigneeRevision,
        lesson: null,
      },
      previous_reports: [{ assignee, report: "PRIVATE OLD REPORT" }],
    });
    const table = {
      id: "ST000001",
      revision: 4,
      status: "active",
      member: "child",
      member_revision: 3,
      title: "Autumn timetable",
      valid_from: "2026-09-01",
      valid_until: "2026-12-31",
      exceptions: [],
      lessons: [
        {
          weekday: 0,
          start: "09:00",
          end: "09:45",
          subject,
          room: "2",
          materials: ["Notebook"],
        },
      ],
      backpack_routine: { id: "R1", revision: 2 },
      backpack_routine_current: { id: "R1", revision: 2, title: "Pack backpack" },
      created_by: "parent",
      history: [],
    };
    const state = {
      revision: 10,
      actor,
      role: members.find((item) => item.id === actor)?.role || "guest",
      settings: {
        name: "Example family",
        modules: ["school", "tasks", "routines"],
        timezone: "Europe/Kyiv",
      },
      members: clone(members),
      tasks: [
        makeTask("T000001", "child", 3, "Own private homework"),
        makeTask("T000002", "sibling", 2, "SIBLING PRIVATE HOMEWORK"),
      ],
      school: {
        timetables: [table],
        upcoming: [],
        homework: [],
        preparations: [],
      },
      routines: {
        templates: [
          {
            id: "R1",
            revision: 2,
            title: "Pack backpack",
            description: "",
            assignees: ["child"],
            creator: "parent",
            enabled: true,
            steps: [{ title: "Notebook", assignee: null }],
          },
        ],
        runs: [],
      },
    };

    let nextTask = 3;
    let nextPreparation = 1;
    let nextRun = 1;
    window.fixture = state;
    window.calls = [];
    window.receipts = new Map();
    window.loseNext = false;

    const CREATE_FIELDS = new Set([
      "member", "member_revision", "title", "due_at", "checklist",
      "reminder_minutes", "grace_minutes", "lesson",
    ]);
    const REVISE_FIELDS = new Set([
      "id", "revision", "member_revision", "title", "due_at",
      "reminder_minutes", "grace_minutes",
    ]);
    const PREPARATION_FIELDS = new Set([
      "timetable_id", "timetable_revision", "member", "member_revision",
      "date", "routine_id", "routine_revision",
    ]);
    const exactFields = (payload, allowed, required = allowed) => {
      if (
        !payload ||
        typeof payload !== "object" ||
        Array.isArray(payload) ||
        Object.keys(payload).some((key) => !allowed.has(key)) ||
        [...required].some((key) => !(key in payload))
      )
        throw { code: "invalid_field" };
    };
    const strictRevision = (value) => {
      if (!Number.isSafeInteger(value) || value < 1) throw { code: "invalid_field" };
      return value;
    };
    const validateDue = (value) => {
      if (value !== null && (typeof value !== "string" || !Number.isFinite(Date.parse(value))))
        throw { code: "invalid_field" };
    };
    const validatePolicy = (payload, defaults = false) => {
      const reminder = payload.reminder_minutes ?? (defaults ? 60 : undefined);
      const grace = payload.grace_minutes ?? (defaults ? 30 : undefined);
      if (
        !Number.isInteger(reminder) ||
        reminder < 0 ||
        reminder > 10080 ||
        !Number.isInteger(grace) ||
        grace < 0 ||
        grace > 1440
      )
        throw { code: "invalid_field" };
      return { reminder, grace };
    };
    const validateCreatePayload = (payload) => {
      exactFields(
        payload,
        CREATE_FIELDS,
        new Set(["member", "member_revision", "title", "due_at", "checklist"]),
      );
      if (
        typeof payload.title !== "string" ||
        !payload.title.trim() ||
        payload.title.length > 500 ||
        !Array.isArray(payload.checklist) ||
        payload.checklist.length > 50 ||
        payload.checklist.some(
          (item) => typeof item !== "string" || !item.trim() || item.length > 200,
        )
      )
        throw { code: "invalid_field" };
      validateDue(payload.due_at);
      return validatePolicy(payload, true);
    };
    const validateRevisePayload = (payload) => {
      exactFields(payload, REVISE_FIELDS);
      strictRevision(payload.revision);
      if (
        typeof payload.title !== "string" ||
        !payload.title.trim() ||
        payload.title.length > 500
      )
        throw { code: "invalid_field" };
      validateDue(payload.due_at);
      return validatePolicy(payload);
    };
    const validateLessonShape = (lesson) => {
      if (lesson === undefined || lesson === null) return;
      exactFields(
        lesson,
        new Set(["timetable_id", "timetable_revision", "date", "lesson_index"]),
      );
      strictRevision(lesson.timetable_revision);
      if (
        typeof lesson.timetable_id !== "string" ||
        !/^\d{4}-\d{2}-\d{2}$/.test(lesson.date) ||
        !Number.isInteger(lesson.lesson_index) ||
        lesson.lesson_index < 0
      )
        throw { code: "invalid_field" };
    };

    const currentActor = () => {
      const current = state.members.find((item) => item.id === state.actor);
      return current?.active && current.role === state.role ? current : null;
    };
    const currentChild = (id, expectedRevision) => {
      const target = state.members.find((item) => item.id === id);
      if (!target?.active || target.role !== "child") throw { code: "unknown_member" };
      strictRevision(expectedRevision);
      if (target.revision !== expectedRevision) throw { code: "conflict" };
      return target;
    };
    const requireModules = (...required) => {
      if (!required.every((item) => state.settings.modules.includes(item)))
        throw { code: "module_disabled" };
    };
    const requireActor = () => {
      const current = currentActor();
      if (!current || current.role === "guest") throw { code: "forbidden" };
      return current;
    };
    const isParent = (record = currentActor()) =>
      ["owner", "parent"].includes(record?.role);
    const currentRoutine = () => {
      if (!state.settings.modules.includes("routines")) return null;
      const routine = state.routines.templates.find(
        (item) =>
          item.id === table.backpack_routine?.id &&
          item.revision === table.backpack_routine?.revision &&
          item.enabled &&
          item.assignees.includes(table.member),
      );
      const creator = state.members.find((item) => item.id === routine?.creator);
      return routine
        && creator?.active
        && ["owner", "parent"].includes(creator.role)
        ? { id: routine.id, revision: routine.revision, title: routine.title }
        : null;
    };
    const currentTable = () => {
      const target = state.members.find((item) => item.id === table.member);
      return Boolean(
        table.status === "active" &&
          target?.active &&
          target.role === "child" &&
          target.revision === table.member_revision,
      );
    };
    const occurrences = () => {
      if (!currentTable()) return [];
      const rows = [];
      for (const date of ["2026-09-07", "2026-09-08"]) {
        if (table.exceptions.includes(date)) continue;
        const day = new Date(`${date}T00:00:00Z`);
        const weekday = (day.getUTCDay() + 6) % 7;
        table.lessons.forEach((lesson, index) => {
          if (lesson.weekday !== weekday) return;
          rows.push({
            id: `${table.id}:${date}:${index}`,
            timetable_id: table.id,
            member: table.member,
            date,
            start: lesson.start,
            end: lesson.end,
            subject: lesson.subject,
            room: lesson.room,
            materials: clone(lesson.materials),
            backpack_routine: currentRoutine(),
          });
        });
      }
      return rows;
    };
    const taskPublic = (task, parent) => {
      const result = clone(task);
      result.managed_by = "school";
      if (!parent) {
        delete result.source;
        delete result.previous_reports;
      }
      return result;
    };
    const project = () => {
      const result = clone(state);
      const active = currentActor();
      const parent = isParent(active);
      result.tasks = state.tasks
        .filter(
          (task) =>
            parent ||
            (active?.role === "child" &&
              task.assignee === active.id &&
              task.assignee_revision === active.revision),
        )
        .map((task) => taskPublic(task, parent));
      if (!active || !["owner", "parent", "child"].includes(active.role)) {
        delete result.school;
        return result;
      }
      if (!state.settings.modules.includes("school")) {
        delete result.school;
        return result;
      }
      const visibleTables = parent
        ? [table]
        : table.member === active.id && currentTable()
          ? [table]
          : [];
      result.school.timetables = visibleTables.map((item) => {
        const value = clone(item);
        if (parent) value.backpack_routine_current = currentRoutine();
        else {
          delete value.created_by;
          delete value.history;
          delete value.backpack_routine_current;
          value.backpack_routine = currentRoutine();
        }
        return value;
      });
      result.school.upcoming = visibleTables.length ? occurrences() : [];
      result.school.homework = state.settings.modules.includes("tasks")
        ? state.tasks
            .filter(
              (task) =>
                parent ||
                (task.assignee === active.id &&
                  task.assignee_revision === active.revision),
            )
            .map((task) => taskPublic(task, parent))
        : [];
      result.school.preparations = state.school.preparations
        .filter(
          (item) =>
            parent ||
            (item.member === active.id && item.member_revision === active.revision),
        )
        .map((item) => ({
          id: item.id,
          revision: item.revision,
          status: item.status,
          timetable_id: item.timetable_id,
          member: item.member,
          date: item.date,
          run_id: item.run_id,
          run_status:
            state.routines.runs.find((run) => run.id === item.run_id)?.status ||
            "unavailable",
        }));
      return result;
    };
    const fingerprint = (action, payload) => JSON.stringify([state.actor, action, payload]);
    const authorizeReplay = (action, payload, saved) => {
      const actorRecord = requireActor();
      requireModules("school");
      if (action === "school.homework_create") {
        requireModules("tasks");
        validateCreatePayload(payload);
        const target = currentChild(payload.member, payload.member_revision);
        validateLessonShape(payload.lesson);
        if (!isParent(actorRecord) && target.id !== state.actor)
          throw { code: "forbidden" };
      } else if (action === "school.homework_revise") {
        requireModules("tasks");
        if (!isParent(actorRecord)) throw { code: "forbidden" };
        validateRevisePayload(payload);
        const task = state.tasks.find((item) => item.id === payload.id);
        if (!task || task.source?.kind !== "school_homework") throw { code: "not_found" };
        const target = currentChild(task.assignee, payload.member_revision);
        if (
          task.assignee_revision !== target.revision ||
          task.source.member !== target.id ||
          task.source.member_revision !== target.revision
        )
          throw { code: "conflict" };
      } else if (action === "school.backpack_start") {
        requireModules("routines");
        exactFields(payload, PREPARATION_FIELDS);
        const target = currentChild(payload.member, payload.member_revision);
        if (!isParent(actorRecord) && actorRecord.id !== target.id)
          throw { code: "forbidden" };
        validatePreparationSource(payload, false);
        const stored = state.school.preparations.find((item) => item.id === saved.id);
        const run = state.routines.runs.find((item) => item.id === saved.run_id);
        const template = state.routines.templates.find(
          (item) => item.id === run?.template_id,
        );
        const creator = state.members.find((item) => item.id === template?.creator);
        if (
          !stored ||
          stored.run_id !== saved.run_id ||
          stored.timetable_id !== payload.timetable_id ||
          stored.timetable_revision !== payload.timetable_revision ||
          stored.member !== payload.member ||
          stored.member_revision !== payload.member_revision ||
          stored.date !== payload.date ||
          stored.routine_id !== payload.routine_id ||
          stored.routine_revision !== payload.routine_revision ||
          !run ||
          run.template_id !== payload.routine_id ||
          run.member !== payload.member ||
          run.cancellation_cause === "authorization_removed" ||
          !creator?.active ||
          !isParent(creator) ||
          (!isParent(actorRecord) && actorRecord.id !== run.member)
        )
          throw { code: "forbidden" };
      } else throw { code: "unknown_action" };
    };
    const validatePreparationSource = (payload, requireWindow) => {
      strictRevision(payload.timetable_revision);
      strictRevision(payload.routine_revision);
      if (
        typeof payload.timetable_id !== "string" ||
        typeof payload.routine_id !== "string" ||
        !/^\d{4}-\d{2}-\d{2}$/.test(payload.date)
      )
        throw { code: "invalid_field" };
      const target = currentChild(payload.member, payload.member_revision);
      if (payload.timetable_id !== table.id) throw { code: "not_found" };
      if (payload.timetable_revision !== table.revision) throw { code: "conflict" };
      if (table.status !== "active") throw { code: "invalid_transition" };
      if (
        table.member !== target.id ||
        table.member_revision !== target.revision
      )
        throw { code: "conflict" };
      if (
        requireWindow &&
        !["2026-09-07", "2026-09-08"].includes(payload.date)
      )
        throw { code: "invalid_field" };
      const occurrence = occurrences().some(
        (item) =>
          item.timetable_id === payload.timetable_id &&
          item.date === payload.date,
      );
      if (requireWindow && !occurrence) throw { code: "invalid_transition" };
      if (table.backpack_routine?.id !== payload.routine_id)
        throw { code: "invalid_field" };
      if (table.backpack_routine.revision !== payload.routine_revision)
        throw { code: "conflict" };
      const routine = state.routines.templates.find(
        (item) => item.id === payload.routine_id,
      );
      const creator = state.members.find((item) => item.id === routine?.creator);
      if (
        !routine ||
        routine.revision !== payload.routine_revision ||
        !routine.enabled ||
        !routine.assignees.includes(target.id) ||
        !creator?.active ||
        !isParent(creator)
      )
        throw { code: "invalid_transition" };
      return target;
    };
    const execute = (action, payload) => {
      const actorRecord = requireActor();
      requireModules("school");
      if (action === "school.homework_create") {
        requireModules("tasks");
        const policy = validateCreatePayload(payload);
        const target = currentChild(payload.member, payload.member_revision);
        if (!isParent(actorRecord) && (actorRecord.role !== "child" || actorRecord.id !== target.id))
          throw { code: "forbidden" };
        if (payload.lesson) {
          validateLessonShape(payload.lesson);
          if (
            !currentTable() ||
            payload.lesson.timetable_id !== table.id ||
            payload.lesson.timetable_revision !== table.revision ||
            table.member !== target.id ||
            !occurrences().some(
              (item) =>
                item.id ===
                `${table.id}:${payload.lesson.date}:${payload.lesson.lesson_index}`,
            )
          )
            throw { code: "conflict" };
        }
        const task = makeTask(
          `T${String(nextTask++).padStart(6, "0")}`,
          target.id,
          target.revision,
          payload.title,
        );
        task.creator = actorRecord.id;
        task.due_at = payload.due_at;
        task.deadline_policy = {
          reminder_minutes: policy.reminder,
          grace_minutes: policy.grace,
          penalty: 0,
        };
        task.checklist = payload.checklist.map((text) => ({ text, done: false }));
        task.source.lesson = clone(payload.lesson ?? null);
        delete task.previous_reports;
        state.tasks.push(task);
        state.revision++;
        return { id: task.id, revision: task.revision, status: task.status };
      }
      if (action === "school.homework_revise") {
        requireModules("tasks");
        if (!isParent(actorRecord)) throw { code: "forbidden" };
        const policy = validateRevisePayload(payload);
        const task = state.tasks.find((item) => item.id === payload.id);
        if (!task || task.source?.kind !== "school_homework") throw { code: "not_found" };
        if (task.revision !== payload.revision) throw { code: "conflict" };
        const target = currentChild(task.assignee, payload.member_revision);
        if (task.source.member !== task.assignee) throw { code: "not_found" };
        if (!["assigned", "accepted", "in_progress", "needs_changes"].includes(task.status))
          throw { code: "invalid_transition" };
        const identityChanged = task.assignee_revision !== target.revision;
        if (identityChanged) {
          if (task.report !== null) {
            task.previous_reports ||= [];
            task.previous_reports.push({
              assignee: task.assignee,
              report: task.report,
              review_note: task.review_note,
              reassigned_at: "2026-09-07T07:00:00+00:00",
            });
          }
          task.status = "assigned";
          task.report = null;
          delete task.review_note;
          delete task.deadline_events;
          task.checklist.forEach((item) => (item.done = false));
        }
        task.title = payload.title;
        task.due_at = payload.due_at;
        task.assignee_revision = target.revision;
        task.source = { ...task.source, member_revision: target.revision };
        task.deadline_policy = {
          reminder_minutes: policy.reminder,
          grace_minutes: policy.grace,
          penalty: 0,
        };
        task.revision++;
        state.revision++;
        return { id: task.id, revision: task.revision, status: task.status };
      }
      if (action === "school.backpack_start") {
        requireModules("routines");
        exactFields(payload, PREPARATION_FIELDS);
        const target = validatePreparationSource(payload, true);
        if (!isParent(actorRecord) && actorRecord.id !== target.id) throw { code: "forbidden" };
        if (
          state.school.preparations.some(
            (item) => item.timetable_id === table.id && item.date === payload.date,
          )
        )
          throw { code: "invalid_transition" };
        if (
          state.routines.runs.some(
            (item) =>
              item.template_id === payload.routine_id &&
              item.member === payload.member &&
              item.status === "active",
          )
        )
          throw { code: "invalid_transition" };
        const run = {
          id: `RR${String(nextRun++).padStart(6, "0")}`,
          revision: 1,
          status: "active",
          template_id: payload.routine_id,
          member: target.id,
        };
        state.routines.runs.push(run);
        const record = {
          id: `SP${String(nextPreparation++).padStart(6, "0")}`,
          revision: 1,
          status: "started",
          timetable_id: table.id,
          timetable_revision: table.revision,
          member: target.id,
          member_revision: target.revision,
          date: payload.date,
          routine_id: payload.routine_id,
          routine_revision: payload.routine_revision,
          run_id: run.id,
        };
        state.school.preparations.push(record);
        state.revision++;
        return { id: record.id, revision: 1, status: "started", run_id: run.id };
      }
      throw { code: "unknown_action" };
    };

    window.project = project;
    window.syncCard = async () => window.card.refresh();
    window.revoke = async (kind) => {
      if (kind === "module") state.settings.modules = state.settings.modules.filter((item) => item !== "tasks");
      if (kind === "actor") state.members.find((item) => item.id === state.actor).role = "adult";
      if (kind === "epoch") state.members.find((item) => item.id === "child").revision++;
      if (kind === "entry") window.card._entry = "different-entry";
      await window.card.refresh();
    };
    const hass = {
      language,
      callWS: async (message) => {
        if (message.type === "family_assistant/view") {
          if (message.entry_id !== "synthetic") throw { code: "forbidden" };
          return project();
        }
        if (message.type !== "family_assistant/execute") throw { code: "unknown_action" };
        window.calls.push(clone(message));
        if (message.entry_id !== "synthetic") throw { code: "forbidden" };
        const key = message.operation_id;
        const prior = window.receipts.get(key);
        if (prior) {
          if (prior.fingerprint !== fingerprint(message.action, message.payload))
            throw { code: "idempotency_conflict" };
          authorizeReplay(message.action, message.payload, prior.result);
          return clone(prior.result);
        }
        const result = execute(message.action, message.payload);
        window.receipts.set(key, {
          fingerprint: fingerprint(message.action, message.payload),
          result: clone(result),
        });
        if (window.loseNext) {
          window.loseNext = false;
          throw { code: "storage_error" };
        }
        return clone(result);
      },
    };
    const card = document.createElement("family-school-card");
    card.setConfig({ entry_id: "synthetic", language });
    card.hass = hass;
    document.querySelector("main").append(card);
    window.card = card;
  </script>
</html>
